<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng nhập</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <link id="favicon" rel="icon" href="https://cdn.glitch.global/d06aa12c-e99e-4369-97e4-7a9bb58fd8b2/4b570c38-c487-4af3-bcbc-5b4804a69e51.image.png?v=1740298260328" type="image/x-icon" />
  <style>
    body { background-color: #ecebdd; }
    .bg-white { background-color: #eaebb1; }
    .text-gray-900 { color: #2d3748; }
    .text-gray-500 { color: #718096; }
    .border-blue-500 { border-color: #63b3ed; }
    .text-blue-600 { color: #4299e1; }
    .hover\:text-gray-700:hover { color: #4a5568; }
    .focus\:ring-blue-500:focus { box-shadow: 0 0 0 3px #63b3ed; }
    .bg-blue-600 { background-color: #3182ce; }
    .hover\:bg-blue-700:hover { background-color: #2b6cb0; }
    .bg-green-500 { background-color: #68d391; }
    .text-red-700 { color: #e53e3e; }
    .bg-red-100 { background-color: #fff5f5; }
    .rounded-full { border-radius: 0.25rem; }
    .text-3xl { font-size: 2rem; color: #374151; }
    .text-gray-500 { color: #a0aec0; font-size: 0.9rem; }
    .border-gray-300 { border-color: #cbd5e0; }
    .text-blue-600 { color: #3182ce; }
    .text-white { color: #edf2f7; }
    .bg-green-500 { background-color: #9ae6b4; color: #276749; }
  </style>
</head>
<body class="min-h-screen">

  <div id="successToast" class="fixed top-4 right-4 hidden bg-green-500 text-green-900 px-6 py-3 rounded-lg shadow-lg z-50">
    <p class="flex items-center">
      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
      </svg>
      <span id="successMessage"></span>
    </p>
  </div>

  <div class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-white rounded-lg shadow-xl p-8 space-y-6">
      <div class="flex space-x-4 mb-6">
        <button onclick="showLogin()" id="loginTab" class="flex-1 py-2 text-center font-medium border-b-2 border-indigo-500 text-indigo-600">Đăng nhập</button>
        <button onclick="showRegister()" id="registerTab" class="flex-1 py-2 text-center font-medium border-b-2 border-transparent text-gray-600 hover:text-gray-800">Đăng ký</button>
      </div>

      <!-- Login -->
      <div id="loginSection">
        <div class="text-center">
          <img src="https://cdn.glitch.global/d06aa12c-e99e-4369-97e4-7a9bb58fd8b2/4b570c38-c487-4af3-bcbc-5b4804a69e51.image.png?v=1740298260328" alt="Logo" class="mx-auto h-12 w-12 rounded-md">
          <h2 class="mt-4 text-2xl font-semibold text-gray-800">Xin Chào!</h2>
          <p class="text-gray-600 mt-1">Đăng nhập đã nha~</p>
        </div>
        <div id="errorMessage" class="hidden p-4 text-sm text-red-600 bg-red-50 rounded-lg" role="alert"></div>
        <form id="loginForm" class="space-y-4 mt-6" onsubmit="return validateLoginForm(event)">
          <div>
            <label class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" id="email" required class="mt-1 block w-full px-3 py-2 border border-gray-400 rounded-md shadow-sm focus:ring-2 focus:ring-indigo-500" placeholder="Nhập email">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Mật khẩu</label>
            <input type="password" id="password" required minlength="6" class="mt-1 block w-full px-3 py-2 border border-gray-400 rounded-md shadow-sm focus:ring-2 focus:ring-indigo-500" placeholder="Nhập mật khẩu">
          </div>
          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <input type="checkbox" id="rememberMe" class="h-4 w-4 text-indigo-600 border-gray-400 rounded">
              <label class="ml-2 block text-sm text-gray-700">Nhớ mật khẩu</label>
            </div>
          </div>
          <button type="submit" class="w-full py-2 px-4 rounded-md text-white bg-indigo-600 hover:bg-indigo-700 transition">Đăng nhập</button>
        </form>
      </div>

      <!-- Register -->
      <div id="registerSection" class="hidden">
        <div class="text-center">
          <img src="https://cdn.glitch.global/d06aa12c-e99e-4369-97e4-7a9bb58fd8b2/4b570c38-c487-4af3-bcbc-5b4804a69e51.image.png?v=1740298260328" alt="Logo" class="mx-auto h-12 w-12 rounded-md">
          <h2 class="mt-4 text-2xl font-semibold text-gray-800">Tạo tài khoản</h2>
          <p class="text-gray-600 mt-1">Đăng ký tài khoản mới</p>
        </div>
        <div id="registerError" class="hidden p-4 text-sm text-red-600 bg-red-50 rounded-lg" role="alert"></div>
        <form id="registerForm" class="space-y-4 mt-6" onsubmit="return validateRegisterForm(event)">
          <div>
            <label class="block text-sm font-medium text-gray-700">Tên</label>
            <input type="text" id="fullName" required class="mt-1 block w-full px-3 py-2 border border-gray-400 rounded-md focus:ring-2 focus:ring-indigo-500" placeholder="Nhập tên">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" id="registerEmail" required class="mt-1 block w-full px-3 py-2 border border-gray-400 rounded-md focus:ring-2 focus:ring-indigo-500" placeholder="Nhập email">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Mật khẩu</label>
            <input type="password" id="registerPassword" required minlength="6" class="mt-1 block w-full px-3 py-2 border border-gray-400 rounded-md focus:ring-2 focus:ring-indigo-500" placeholder="Nhập mật khẩu">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Xác nhận mật khẩu</label>
            <input type="password" id="confirmPassword" required minlength="6" class="mt-1 block w-full px-3 py-2 border border-gray-400 rounded-md focus:ring-2 focus:ring-indigo-500" placeholder="Nhập lại mật khẩu">
          </div>
          <button type="submit" class="w-full py-2 px-4 rounded-md text-white bg-indigo-600 hover:bg-indigo-700 transition">Đăng ký</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const secretKey = "mySecretKey123";
    const encryptedLink = "U2FsdGVkX1+Avyd9aZss6MIXQIvY1mKJty7mX3uM8Uo="; // đã mã hóa "12a1digiuatroirucro.html"

    document.addEventListener('DOMContentLoaded', () => {
      const savedUser = JSON.parse(localStorage.getItem('loggedInUser'));
      if (savedUser) {
        document.getElementById('email').value = savedUser.email;
      }
    });

    function showSuccess(message) {
      const toast = document.getElementById('successToast');
      document.getElementById('successMessage').textContent = message;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function showError(msg) {
      const el = document.getElementById('errorMessage');
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 3000);
    }

    function showRegisterError(msg) {
      const el = document.getElementById('registerError');
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 3000);
    }

    function showLogin() {
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('registerSection').classList.add('hidden');
      document.getElementById('loginTab').classList.add('border-indigo-500', 'text-indigo-600');
      document.getElementById('registerTab').classList.remove('border-indigo-500', 'text-indigo-600');
    }

    function showRegister() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('registerSection').classList.remove('hidden');
      document.getElementById('registerTab').classList.add('border-indigo-500', 'text-indigo-600');
      document.getElementById('loginTab').classList.remove('border-indigo-500', 'text-indigo-600');
    }

    function validateLoginForm(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !password) return showError('Vui lòng điền đầy đủ thông tin');
      if (!emailRegex.test(email)) return showError('Định dạng email không hợp lệ');
      if (password.length < 6) return showError('Mật khẩu quá ngắn');

      authenticateUser(email, password);
    }

    function validateRegisterForm(e) {
      e.preventDefault();
      const name = document.getElementById('fullName').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      const confirm = document.getElementById('confirmPassword').value;

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!name || !email || !password || !confirm) return showRegisterError('Vui lòng điền đầy đủ thông tin');
      if (!emailRegex.test(email)) return showRegisterError('Định dạng email không hợp lệ');
      if (password.length < 6) return showRegisterError('Mật khẩu quá ngắn');
      if (password !== confirm) return showRegisterError('Mật khẩu không khớp');

      registerUser(name, email, password);
    }

    function registerUser(fullName, email, password) {
      const users = JSON.parse(localStorage.getItem('users')) || [];
      const existing = users.find(u => u.email === email);
      if (existing) return showRegisterError('Email đã được đăng ký');

      users.push({ fullName, email, password });
      localStorage.setItem('users', JSON.stringify(users));
      showSuccess('Đăng ký thành công! Vui lòng đăng nhập.');

      setTimeout(() => {
        showLogin();
        document.getElementById('registerForm').reset();
      }, 1500);
    }

    function authenticateUser(email, password) {
      const users = JSON.parse(localStorage.getItem('users')) || [];
      const user = users.find(u => u.email === email && u.password === password);
      if (!user) return showError('Email hoặc mật khẩu không đúng');

      const remember = document.getElementById('rememberMe').checked;
      localStorage.setItem('loggedInUser', JSON.stringify(user))
      showSuccess('Đăng nhập thành công! Đang chuyển hướng...');
      const decryptedLink = CryptoJS.AES.decrypt(encryptedLink, secretKey).toString(CryptoJS.enc.Utf8);
      setTimeout(() => {
        window.location.href = '12a1digiuatroirucro.html';
        }, 1500);
    }
  </script>
</body>
</html>
